name: CD Deploy

on:
  workflow_run:
    workflows: [ "CI/CD Pipeline" ]
    types: [ "completed" ]
  #workflow_dispatch:
   # inputs:
    #  image_ref:
     #   description: 'Docker image (oaojoicani/go-fibonacci-api)'
      #  required: true
      #ec2_host:
       # description: 'EC2 public IP or DNS'
        #required: true
      #ssh_username:
       # description: 'EC2 SSH username (e.g. student01)'
        #required: true
        #default: 'student01'
      #student_number:
       # description: 'Student number (81-90) — maps to port 808<Student Number>'
        #required: true
        #default: '81'

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: student-deploy
    
    env:
      # Variáveis
      IMAGE_REPO: ${{ vars.IMAGE_REPO }}
      EC2_HOST: ${{ vars.EC2_HOST }}
      SSH_USERNAME: ${{ vars.SSH_USERNAME }}
      STUDENT_NUMBER: ${{ vars.STUDENT_NUMBER }}
      STUDENT_PASSWORD: ${{ secrets.STUDENT_PASSWORD }}

   
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy container
        run: |
          PORT="80${STUDENT_NUMBER}"
          sshpass -p "${STUDENT_PASSWORD}" \
            ssh -o StrictHostKeyChecking=no \
                "${SSH_USERNAME}@${EC2_HOST}" \
                "IMAGE_REF='${IMAGE_REPO}' PORT='${PORT}' bash -s" << 'EOF'
          set -euo pipefail

          echo "Pulling image: ${IMAGE_REF}"
          docker pull "${IMAGE_REF}"

          echo "Stopping any container publishing port ${PORT} (if any)..."
          docker ps -q --filter "publish=${PORT}" | xargs -r docker stop

          echo "Running container on host port ${PORT} -> container 8080..."
          docker run -d -p "${PORT}:8080" "${IMAGE_REF}"

          echo "Current containers:"
          docker ps --format 'table {{.ID}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}'
          EOF
